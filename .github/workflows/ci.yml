name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: skip the postinstall node-pty rebuild for Electron and
      # vendoring; lint and unit tests don't need native modules.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
